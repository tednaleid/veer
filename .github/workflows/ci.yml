name: CI
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check
      # Fuzz: disabled because `zig build test --fuzz` fails to compile Zig's
      # own test runner (compiler/test_runner.zig, StackTrace type mismatch).
      # Fuzz test functions still run as regular tests above.
      # Re-enable once that is fixed: timeout 20 zig build test --fuzz; test $? -eq 124

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Benchmark
        run: zig build bench -Doptimize=ReleaseFast

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build release
        run: zig build -Doptimize=ReleaseSmall
      - name: Check binary size
        run: |
          size=$(stat -c%s zig-out/bin/veer)
          echo "Binary size: $size bytes ($(( size / 1024 ))KB)"
          if [ "$size" -gt 3145728 ]; then
            echo "FAIL: binary exceeds 3MB"
            exit 1
          fi
